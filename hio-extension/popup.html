<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Tahoma, Arial, sans-serif; width: 320px; padding: 12px; margin: 0; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .box { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 10px; background: #fafafa; }
  .box p { margin: 2px 0; font-size: 12px; }
  .box .muted { color: #777; }
  button { width: 100%; padding: 8px; margin-bottom: 8px; border: none; border-radius: 5px; font-size: 13px; cursor: pointer; }
  .primary { background: #2563eb; color: #fff; }
  .secondary { background: #059669; color: #fff; }
  .danger { background: #f3f4f6; color: #b91c1c; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { font-size: 12px; color: #444; margin-top: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>ربط الفاتورة بمنظومة HIO</h1>

  <div class="box" id="dataBox">
    <p class="muted">لا توجد بيانات فاتورة مُصدَّرة بعد.</p>
  </div>

  <button class="primary" id="btnExport">1) تصدير بيانات الفاتورة من هذه الصفحة</button>
  <button class="secondary" id="btnFill">2) بدء المساعدة فى صفحة HIO</button>
  <button class="danger" id="btnClear">مسح البيانات المُصدَّرة</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
